version: "3.8"
services:
  db:
    image: mysql:8
    container_name: sso-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sso-flask
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app:rw
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    container_name: sso-react
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: on-failure

volumes:
  db_data:
